services:
  - type: web
    name: lumora-backend
    env: node
    branch: master
    root: apps/api
    plan: free
    buildCommand: "npm install --no-audit --no-fund && npm run build"
    startCommand: "npm start"
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        value: ""
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
