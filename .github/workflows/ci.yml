name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install API dependencies
        run: |
          cd apps/api
          npm ci

      - name: Build API (TypeScript)
        run: |
          cd apps/api
          npm run build

      - name: Run core unit tests
        run: |
          cd apps/api
          node -r ts-node/register ../../core/tests/run-all.ts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist

  e2e:
    name: E2E Tests (Boot server, Health check, Run E2E)
    needs: build-test
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure GROQ_API_KEY is present
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "Missing required secret: GROQ_API_KEY"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install API dependencies
        run: |
          cd apps/api
          npm ci

      - name: Build API (TypeScript)
        run: |
          cd apps/api
          npm run build

      - name: Start API server (background)
        run: |
          cd apps/api
          # start server in background and save logs
          nohup node dist/apps/api/src/index.js > server.log 2>&1 & echo $! > server.pid

      - name: Wait for health endpoint
        run: |
          cd apps/api
          echo "Waiting for server to be ready at http://127.0.0.1:4000/health..."
          for i in $(seq 1 30); do
            if curl -sS http://127.0.0.1:4000/health | grep -q '"status":"ok"'; then
              echo "Server healthy"
              exit 0
            fi
            echo "Retry $i/30..."
            sleep 2
          done
          echo "Server did not become healthy in time. Dumping server.log:"
          cat server.log || true
          exit 1

      - name: Run E2E suite
        run: |
          cd apps/api
          # run the TypeScript E2E harness; expect non-zero exit on regression
          node -r ts-node/register src/tests/e2e.ts

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: apps/api/server.log

  deploy-render:
    name: Trigger Render Staging Deploy
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render manual deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Missing required Render secrets: RENDER_API_KEY, RENDER_SERVICE_ID"
            exit 1
          fi
          echo "Triggering Render deploy for service $RENDER_SERVICE_ID ..."

          response=$(curl -s -w "\n%{http_code}" -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commit\":\"${GITHUB_SHA}\"}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP $http_code"
          echo "$body"

          if [ "$http_code" -ge 400 ]; then
            echo "Render deploy failed (HTTP $http_code)."
            exit 1
          fi
